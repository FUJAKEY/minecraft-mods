name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x real_life_mod/gradlew

    - name: Build with Gradle
      run: ./gradlew build
      working-directory: real_life_mod

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RealLifeMod-Build
        path: real_life_mod/build/libs/*.jar
