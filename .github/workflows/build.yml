name: Build and Package pipi_mod

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipi_mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Ensure Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --console=plain --no-daemon

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipi-mod-artifacts
          path: pipi_mod/build/libs/*.jar
          if-no-files-found: error
