// ForgeGradle build script for IndustrialSynergy
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+' // ForgeGradle 5 supports MC 1.16.5
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.example.industrialsynergy'
archivesBaseName = 'industrialsynergy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8) // Target Java 8 per requirement
    }
}

minecraft {
    // Use the official Mojang mappings for 1.16.5
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                industrialsynergy {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                industrialsynergy {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            args '--mod', 'industrialsynergy', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                industrialsynergy {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39' // Latest Forge for 1.16.5
    // Example of optional Mekanism dependency (compileOnly to avoid bundling)
    compileOnly fg.deobf("mekanism:Mekanism:1.16.5-10.1.1.456")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'IndustrialSynergy',
            'Specification-Vendor'  : 'ExampleModders',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'ExampleModders'
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}
